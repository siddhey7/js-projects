<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI CALCULATOR</title>
  </head>
  <body>
    <center><h1>BMI CALCULATOR</h1>
    <form>
      <div>height in cm <input type="text" id="height" /></div>
      <br>
      <div>weight in kg <input type="text" id="weight" /></div>
      <br>
      <div><input type="submit" value="calculate" id="btn"></div>
      <div id="results"></div>
      <br>
      <div id="weight-guide">
          <h3>BMI Weight Guide</h3>
          <p>Under Weight = Less than 18.6</p>
          <p>Normal Range = 18.6 and 24.9</p>
          <p>Overweight = Greater than 24.9</p>
        </div>
    </form>
    </center>
    <script src="script.js"></script> 
  </body>
</html>
